name: Hark 镜像

# 构建 sub2api-hark 的 Docker 镜像并推到 ghcr.io/<owner>/sub2api-hark（latest + 提交号）。
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: hark-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: 镜像名
        id: n
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sub2api-hark" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT=${{ steps.n.outputs.sha }}
            DATE=${{ steps.n.outputs.date }}
          tags: |
            ${{ steps.n.outputs.image }}:latest
            ${{ steps.n.outputs.image }}:${{ steps.n.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
